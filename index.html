<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Controller</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 400px; margin: 0 auto; }
        button { 
            padding: 30px 10px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 12px; 
            cursor: pointer; transition: transform 0.1s; text-transform: uppercase;
        }
        button:active { transform: scale(0.95); }
        .btn-connect { grid-column: span 2; background: #2196F3; color: white; margin-bottom: 20px; }
        .btn-scan { background: #4CAF50; color: white; }
        .btn-reset { background: #F44336; color: white; }
        .btn-test { background: #FFEB3B; color: black; }
        .btn-off { background: #9E9E9E; color: white; }
        #status { margin: 20px; padding: 10px; border: 1px solid #333; border-radius: 8px; color: #aaa; font-family: monospace; }
    </style>
</head>
<body>

    <h2>DEVICE CONTROL</h2>
    
    <button class="btn-connect" id="connect">Connect Dongle</button>

    <div class="grid">
        <button class="btn-scan" onclick="sendCommand('SCAN')">Scan</button>
        <button class="btn-reset" onclick="sendCommand('RESET')">Reset</button>
        <button class="btn-test" onclick="sendCommand('TEST')">Test</button>
        <button class="btn-off" onclick="sendCommand('OFF')">Off</button>
    </div>

    <div id="status">Status: Disconnected</div>

    <script>
        let port;
        const connectBtn = document.getElementById('connect');
        const statusDiv = document.getElementById('status');

        async function sendCommand(cmd) {
            if (!port) { alert('Connect the dongle first!'); return; }
            statusDiv.innerText = "Sending: " + cmd;
            const encoder = new TextEncoder();
            const writer = port.writable.getWriter();
            await writer.write(encoder.encode(cmd + "\n"));
            writer.releaseLock();
        }

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                statusDiv.innerText = "Status: Connected";
                connectBtn.innerText = "Connected";
                connectBtn.style.background = "#444";
            } catch (e) {
                statusDiv.innerText = "Error: " + e.message;
            }
        });
    </script>
</body>
</html>
